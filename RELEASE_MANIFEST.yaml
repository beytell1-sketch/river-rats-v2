# RELEASE_MANIFEST.yaml
#
# Tracks approved integration state across all River Rats streams.
# Updated by the orchestrator (main terminal) when any stream reaches an
# approved milestone. Build repos remain independent; this file captures
# which commits are blessed for integrated use.
#
# Read by: humans (what ships together), deployment scripts (which SHAs
# to check out), playtest correlation (which combination produced a log).
# Write by: orchestrator on approval gate. Do not edit from build repos.
#
# Update procedure:
#   1. A stream ships a milestone in its own repo (independent)
#   2. Orchestrator reviews and approves for integration
#   3. Orchestrator bumps the relevant entry here with a commit referencing
#      the approval directive in review/comms/
#   4. Cross-stream consumers can rely on the manifest for coordination

