# ==============================================================================
# River Rats v2.4 Stage 3.5 — Range-Narrowing Test Corpus
# ==============================================================================
# Generated: 2026-04-20
# Purpose: Exercise narrow_by_action_history + narrow_to_continuing_range on
#          synthetic + reproduced hand shapes. Feeds unit tests + retroactive
#          audits for the Stage 3.5 action-chain range-narrowing fix.
#
# Philosophy:
#   - Coverage > precision. 75 cases, expected values are APPROXIMATE and
#     should be refined against the eventual reference implementation.
#   - Each category exercises a distinct failure mode of the pre-fix code.
#   - All percentages are fractional (0.30 == 30%), rounded to 2 dp.
#
# Expected-value derivation:
#   Baseline composition (generic single-raised-pot preflop opener, post
#   position filter, pre action chain):
#     TP+ (nuts + strong_value + good_value):     ~0.30
#     medium_made:                                ~0.15
#     draw:                                       ~0.15
#     air (+ bluffs/weak_made collapsed):         ~0.40
#   All per-street frequency tables from range_narrowing.py (solver-grounded
#   for BET/CHECK; heuristic per M1 review for CALL).
#
# Notes column conventions:
#   - "[pre]" = pre-fix behaviour (single-street narrow only, or none)
#   - "[post]" = post-fix behaviour (full chain via narrow_by_action_history)
#   - "[approx]" = values derived by hand from frequency tables, refine in CI
# ==============================================================================

# ------------------------------------------------------------------------------
# A. Simple chains (10 cases) — single action per street, pure chains.
