- id: "T_A01_invalid_schema_sentinel"
  category: "A. Simple chains"
  description: "SCHEMA SENTINEL: uses CHECK_RAISE as a single action token (invalid; should be CHECK then RAISE). Must be filtered by action normaliser, not crash chain."
  hero_position: "BTN"
  villain_position: "BB"
  opener: "BTN"
  board: ["Qh", "7s", "5d", "Kc", "2h"]
  action_history:
    - {street: "preflop", position: "BTN", action: "RAISE"}
    - {street: "preflop", position: "BB",  action: "CALL"}
    - {street: "flop",    position: "BB",  action: "CHECK_RAISE"}      # invalid token
  decision_street: "river"
  expected_composition_pre_fix:
    villain_tp_pct: null
    villain_medium_made_pct: null
    villain_draw_pct: null
    villain_air_pct: null
  expected_composition_post_fix:
    villain_tp_pct: null
    villain_medium_made_pct: null
    villain_draw_pct: null
    villain_air_pct: null
  notes: "SAFETY. CHECK_RAISE is not a legal normalised action (see _action_to_narrow — maps unknowns to 'skip'). Chain should skip the entry and continue. Expected behaviour: no crash, chain proceeds with only the preflop actions (which are themselves skipped since chain operates flop→river). Proper line in T_A01b."

